<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>JavaScript Cake</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #FFB7A5;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    .container { width: 100%; max-width: 700px; text-align: center; }

    .cake {
      position: relative;
      width: 230px;
      height: 105px;
      margin: 0 auto;
      transform: translateY(30px);
    }

    .layer {
      position: absolute;
      left: 0;
      width: 100%;
      height: 35px;
      background: #9a5f4f;
      border-radius: 7px;
      box-shadow: inset 0 -7px rgba(80, 40, 30, .15);
      opacity: 0;
      transform: scaleX(.85);
      animation: buildLayer .9s ease-out forwards;
    }

    .layer:nth-child(1) { top: 70px; animation-delay: .2s; }
    .layer:nth-child(2) { top: 35px; animation-delay: 1.1s; }
    .layer:nth-child(3) { top: 0; animation-delay: 2s; }

    .frosting {
      position: absolute;
      top: -5px;
      left: -2px;
      width: 234px;
      height: 32px;
      background: #fffdf4;
      border-radius: 12px 12px 5px 5px;
      z-index: 5;
      opacity: 0;
      animation: reveal .7s ease-out 2.9s forwards;
    }

    .frosting::before,
    .frosting::after,
    .drip {
      content: "";
      position: absolute;
      background: #fffdf4;
    }

    .frosting::before {
      width: 18px;
      height: 55px;
      left: 30px;
      top: 10px;
      border-radius: 0 0 10px 10px;
    }

    .frosting::after {
      width: 17px;
      height: 42px;
      right: 25px;
      top: 12px;
      border-radius: 0 0 10px 10px;
    }

    .drip {
      width: 22px;
      height: 30px;
      top: 8px;
      left: 105px;
      border-radius: 0 0 12px 12px;
      z-index: 6;
      opacity: 0;
      animation: reveal .7s ease-out 2.9s forwards;
    }

    .candle {
      position: absolute;
      width: 7px;
      height: 42px;
      left: 50%;
      top: -48px;
      z-index: 10;
      opacity: 0;
      transform: translateX(-50%);
      background: repeating-linear-gradient(to bottom, #fff 0 7px, #eee 7px 11px);
      animation: reveal .7s ease-out 3.5s forwards;
    }

    .flame {
      position: absolute;
      width: 13px;
      height: 22px;
      left: 50%;
      top: -24px;
      transform: translateX(-50%);
      background: #FF8D00;
      border-radius: 50%;
      box-shadow: 0 0 18px #fc3;
      animation: flicker .5s infinite alternate;
    }

    .plate {
      width: 265px;
      height: 5px;
      margin: 38px auto 0;
      background: white;
    }

    .message { margin-top: 45px; color: #1A0B2E; }
    .message h1 { margin: 0; font-size: 30px; font-weight: 400; font-style: italic; }
    .message p { margin-top: 18px; font-size: 24px; font-style: italic; }

    button {
      margin-top: 15px;
      padding: 10px 16px;
      border: 0;
      border-radius: 20px;
      cursor: pointer;
      color: #a75d69;
      background: white;
      font-size: 16px;
    }

    @keyframes buildLayer {
      from { opacity: 0; transform: scaleX(.85) translateY(12px); }
      to { opacity: 1; transform: scaleX(1) translateY(0); }
    }

    @keyframes reveal {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes flicker {
      from { transform: translateX(-50%) scale(1); }
      to { transform: translateX(-50%) scale(.8, 1.15); }
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="animated">
      <div class="cake">
        <div class="layer"></div>
        <div class="layer"></div>
        <div class="layer"></div>
        <div class="frosting"></div>
        <div class="drip"></div>
        <div class="candle"><div class="flame"></div></div>
      </div>

      <div class="plate"></div>

      <div class="message">
        <h1>Happy Birthday, Nars!</h1>
        <p>Praying that you will pass on your Board Exams!</p>
      </div>
    </div>

    <button id="replayBtn">🔄 Replay Animation</button>
  </main>

  <script>
    const replayBtn = document.getElementById("replayBtn");

    replayBtn.addEventListener("click", () => {
      const animation = document.querySelector(".animated");
      animation.style.display = "none";
      void animation.offsetWidth;
      animation.style.display = "";
    });
  </script>
</body>
</html>
